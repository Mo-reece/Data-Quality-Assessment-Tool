name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          data-quality examples/orders.csv -c examples/orders_rules.json \
            --ref customers=examples/customers.csv --json out.json -q
          sh scripts/build_web.sh
